version: "3.8"

services:
  streamlit_app:
    build: .
    container_name: nes_portal_app
    # Load ONLY credentials from the .env file for automation.py
    env_file:
      - .env

    # Map the Streamlit port (8501 inside container) to the host machine
    ports:
      - "8501:8501"

    # Mount volumes
    volumes:
      # Mount a local directory to store screenshots generated by automation.py
      # automation.py needs to save screenshots relative to /app/screenshots
      - ./screenshots:/app/screenshots:rw

      # Mount a dedicated directory for intermediate data (uploaded files, filtered csv, date json)
      # app.py needs to be modified to use /app/app_data for these files
      - ./app_data:/app/app_data:rw

      # Optionally mount config.yaml read-only if you want to manage it outside the image
      # - ./config.yaml:/app/config.yaml:ro

    # Recommended for Playwright: Increase shared memory size
    shm_size: "2gb" # Adjust as needed

    # Healthcheck (Optional but recommended for Streamlit)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s # Give Streamlit time to start up
