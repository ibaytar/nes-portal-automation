version: "3.8"

services:
  nes-automation:
    build: .
    container_name: nes_automation_runner
    # Load ONLY credentials from the .env file
    env_file:
      - .env

    # Environment variables for arguments are now expected to be passed at runtime
    # We remove the 'environment:' block that set defaults here

    # Mount volumes for data persistence and input/output
    volumes:
      # Mount a local directory containing your input CSV into the container
      # The user must ensure the INPUT_CSV value passed at runtime matches a file here
      - ./data:/app/data:rw
      # Mount a local directory to store screenshots generated by the script
      - ./screenshots:/app/screenshots:rw
      # Mount a local directory for the date file if the user provides the DATE_FILE variable
      - ./date:/app/date:rw

    # Define the command structure.
    # The variables (${...}) MUST be provided when running the container.
    command: >
      --invoice-date "${INVOICE_DATE}"
      --input-csv "${INPUT_CSV}"
      --row-replacement "${ROW_REPLACEMENT}"
      ${DATE_FILE:+--date-file "${DATE_FILE}"}
      ${SCREENSHOT:+--screenshot}

    # Recommended for Playwright: Increase shared memory size
    shm_size: "2gb" # Adjust as needed
