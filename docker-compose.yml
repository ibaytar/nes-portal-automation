version: "3.8"

services:
  nes-automation:
    build: .
    container_name: nes_automation_runner
    # Load environment variables from the .env file
    env_file:
      - .env
    # Define environment variables for arguments (can be overridden)
    # These will be picked up by argparse in the script if passed in the command
    # Or you can modify the script to read these directly using os.getenv as defaults
    environment:
      # Example: Set default invoice date if not provided in .env or command line
      - INVOICE_DATE=${INVOICE_DATE:-07-25} # Default to 07-25 if not set
      - INPUT_CSV=${INPUT_CSV:-/app/data/input.csv}
      - ROW_REPLACEMENT=${ROW_REPLACEMENT:-Personalize Defter}
      - DATE_FILE=${DATE_FILE} # Optional, only set if needed
      - SCREENSHOT=${SCREENSHOT:-false} # Default to false

    # Mount volumes for data persistence and input/output
    volumes:
      # Mount a local directory containing your input CSV into the container
      # Create a 'data' directory locally and put your CSV there
      - ./data:/app/data:rw
      # Mount a local directory to store screenshots generated by the script
      - ./screenshots:/app/screenshots:rw
      # Mount a local directory for the date file if you use it
      # Create a 'date' directory locally if you use the date file feature
      - ./date:/app/date:rw # Optional: Only include if --date-file is used

    # Define the command to run, passing arguments from environment variables
    # Ensure your script correctly parses these arguments
    command: >
      --invoice-date "${INVOICE_DATE}"
      --input-csv "${INPUT_CSV}"
      --row-replacement "${ROW_REPLACEMENT}"
      ${DATE_FILE:+--date-file "${DATE_FILE}"} # Conditionally add --date-file if DATE_FILE is set
      ${SCREENSHOT:+--screenshot} # Conditionally add --screenshot if SCREENSHOT is true or set

    # Recommended for Playwright: Increase shared memory size
    shm_size: "2gb" # Adjust as needed
